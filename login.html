<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Condux — Entrar</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1b1f24; --mut:#6b7280; --line:#e5e7eb; --blue:#1162b9; --err:#dc2626; --ok:#0f9d58; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1a1f26; --ink:#eef1f4; --mut:#98a2b3; --line:#2a313b; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:16px; }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 24px; }
  h1 { font-size:22px; margin:0 0 4px; letter-spacing:.02em; }
  p { color:var(--mut); margin:0 0 18px; font-size:14px; }
  label { font-size:13px; color:var(--mut); display:block; margin-bottom:6px; }
  input { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; }
  button { width:100%; margin-top:14px; padding:11px; border-radius:10px; border:0; background:var(--blue); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .msg { margin-top:14px; font-size:14px; }
  .erro { color:var(--err); } .ok { color:var(--ok); }
</style>
</head>
<body>
<div class="card">
  <h1>CONDUX</h1>
  <p id="sub">Painel interno. Entre com o seu e-mail autorizado — enviamos um link de acesso.</p>
  <form id="f">
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="email" required placeholder="voce@exemplo.com">
    <button id="b" type="submit">Enviar link de acesso</button>
  </form>
  <div class="msg" id="msg"></div>
</div>
<script>
const SB_URL = 'https://ilekppgaltsrwmnodqxw.supabase.co';
const SB_PUB = 'sb_publishable_CHIZxHt21omg3SEOHfRu3g_DDnPj72G';
const CHAVE = 'sb-ilekppgaltsrwmnodqxw-auth-token';
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
const volta = (q.get('volta') || 'index.html').replace(/^\/+/, '');
const destino = /^[\w\-./?=&%]+$/.test(volta) && !volta.includes('login.html') ? volta : 'index.html';
if (q.get('m') === 'expirou') { $('msg').className = 'msg erro'; $('msg').textContent = 'Sua sessão expirou. Entre de novo.'; }
if (q.get('m') === 'negado') { $('msg').className = 'msg erro'; $('msg').textContent = 'Este e-mail não está autorizado a acessar o painel.'; }

// Volta do link do e-mail: tokens chegam no #hash
async function entrarPeloLink() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('error_description')) { $('msg').className = 'msg erro'; $('msg').textContent = 'Link inválido ou expirado. Peça um novo.'; history.replaceState(null, '', location.pathname + location.search); return; }
  const at = h.get('access_token'), rt = h.get('refresh_token');
  if (!at || !rt) return;
  history.replaceState(null, '', location.pathname + location.search);
  $('sub').textContent = 'Entrando…'; $('f').style.display = 'none';
  const u = await fetch(SB_URL + '/auth/v1/user', { headers: { apikey: SB_PUB, Authorization: 'Bearer ' + at } }).then(r => r.json()).catch(() => null);
  // Confere se o e-mail está na lista de autorizados
  const ok = await fetch(SB_URL + '/rest/v1/rpc/painel_autorizado', { method: 'POST', headers: { apikey: SB_PUB, Authorization: 'Bearer ' + at, 'Content-Type': 'application/json' }, body: '{}' }).then(r => r.json()).catch(() => false);
  if (ok !== true) {
    fetch(SB_URL + '/auth/v1/logout', { method: 'POST', headers: { apikey: SB_PUB, Authorization: 'Bearer ' + at } }).catch(() => {});
    $('sub').textContent = 'Painel interno.'; $('f').style.display = '';
    $('msg').className = 'msg erro'; $('msg').textContent = 'Este e-mail não está autorizado a acessar o painel.'; return;
  }
  localStorage.setItem(CHAVE, JSON.stringify({ access_token: at, refresh_token: rt, token_type: 'bearer', expires_in: +h.get('expires_in') || 3600, expires_at: +h.get('expires_at') || Math.floor(Date.now() / 1000) + 3600, user: u }));
  location.replace(destino);
}
entrarPeloLink();
window.addEventListener('hashchange', entrarPeloLink);

$('f').onsubmit = async (e) => {
  e.preventDefault();
  const email = $('email').value.trim().toLowerCase();
  $('b').disabled = true; $('msg').className = 'msg'; $('msg').textContent = 'Enviando…';
  const redirect = location.origin + '/login.html' + (q.get('volta') ? '?volta=' + encodeURIComponent(q.get('volta')) : '');
  try {
    const r = await fetch(SB_URL + '/auth/v1/otp?redirect_to=' + encodeURIComponent(redirect), {
      method: 'POST', headers: { apikey: SB_PUB, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, create_user: true })
    });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.msg || j.error_description || ('erro ' + r.status)); }
    $('msg').className = 'msg ok'; $('msg').textContent = 'Pronto! Abra o e-mail que enviamos para ' + email + ' e clique no link para entrar. Pode fechar esta aba.';
  } catch (err) {
    $('msg').className = 'msg erro';
    $('msg').textContent = /rate|seconds|limit/i.test(err.message) ? 'Muitos pedidos seguidos. Espere um minuto e tente de novo.' : 'Não foi possível enviar o link: ' + err.message;
  } finally { $('b').disabled = false; }
};
</script>
</body>
</html>
